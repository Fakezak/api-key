<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key & Secret Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .generator-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .key-section {
            margin-bottom: 20px;
        }

        .key-section:last-child {
            margin-bottom: 0;
        }

        .key-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.95em;
        }

        .key-label .badge {
            font-size: 0.7em;
            background: #e0e0e0;
            padding: 2px 10px;
            border-radius: 12px;
            color: #666;
            font-weight: 500;
        }

        .key-display {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .key-display input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            background: white;
            color: #333;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .key-display input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .key-display input:disabled {
            background: #f5f5f5;
            color: #999;
        }

        .key-display input::placeholder {
            color: #bbb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn-group .btn {
            flex: 1;
            justify-content: center;
            min-width: 120px;
        }

        .options {
            display: flex;
            gap: 25px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #555;
            font-size: 0.9em;
            cursor: pointer;
        }

        .options select {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            font-size: 0.95em;
        }

        .options input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .history {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-header h3 {
            color: #555;
            font-size: 1.1em;
        }

        .history-header .count {
            background: #e0e0e0;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            color: #666;
        }

        #historyList {
            max-height: 250px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        #historyList::-webkit-scrollbar {
            width: 6px;
        }

        #historyList::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        #historyList::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .history-item {
            background: white;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-item .keys {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            color: #333;
            word-break: break-all;
        }

        .history-item .keys .api {
            color: #667eea;
        }

        .history-item .keys .secret {
            color: #e74c3c;
        }

        .history-item .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 0.7em;
            color: #999;
        }

        .history-item .meta .timestamp {
            color: #bbb;
        }

        .empty-history {
            text-align: center;
            color: #bbb;
            padding: 30px 0;
            font-size: 0.95em;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: fadeInUp 0.4s ease;
            max-width: 350px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast.success {
            background: #2ecc71;
        }

        .toast.error {
            background: #e74c3c;
        }

        .toast.info {
            background: #3498db;
        }

        .toast.warning {
            background: #f39c12;
        }

        .copy-feedback {
            position: absolute;
            background: #2ecc71;
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.7em;
            right: 70px;
            top: -25px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .copy-feedback.show {
            opacity: 1;
            top: -30px;
        }

        .key-wrapper {
            position: relative;
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.6em;
            }

            .key-display {
                flex-direction: column;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-group .btn {
                width: 100%;
            }

            .options {
                flex-direction: column;
                gap: 12px;
            }

            .toast {
                bottom: 15px;
                right: 15px;
                left: 15px;
                max-width: none;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 API Key Generator</h1>
        <p class="subtitle">Generate secure API keys and secrets for your applications</p>

        <div class="generator-box">
            <div class="key-section">
                <div class="key-label">
                    <span>📌 API Key</span>
                    <span class="badge">Public</span>
                </div>
                <div class="key-display">
                    <div class="key-wrapper">
                        <input type="text" id="apiKey" readonly placeholder="Click Generate to create API key">
                        <span class="copy-feedback" id="apiCopyFeedback">Copied!</span>
                    </div>
                    <button class="btn btn-success" onclick="copyKey('apiKey')">📋 Copy</button>
                </div>
            </div>

            <div class="key-section">
                <div class="key-label">
                    <span>🔐 Secret Key</span>
                    <span class="badge">Private</span>
                </div>
                <div class="key-display">
                    <div class="key-wrapper">
                        <input type="text" id="secretKey" readonly placeholder="Click Generate to create secret key">
                        <span class="copy-feedback" id="secretCopyFeedback">Copied!</span>
                    </div>
                    <button class="btn btn-success" onclick="copyKey('secretKey')">📋 Copy</button>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="generateKeys()">🔄 Generate Keys</button>
                <button class="btn btn-outline" onclick="clearKeys()">🗑️ Clear</button>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="autoCopy" checked>
                    Auto-copy to clipboard
                </label>
                <label>
                    Key Length:
                    <select id="keyLength">
                        <option value="16">16</option>
                        <option value="24">24</option>
                        <option value="32" selected>32</option>
                        <option value="40">40</option>
                        <option value="48">48</option>
                    </select>
                </label>
                <label>
                    <input type="checkbox" id="showSecret" onchange="toggleSecret()">
                    Show Secret
                </label>
            </div>
        </div>

        <div class="history">
            <div class="history-header">
                <h3>📜 History</h3>
                <span class="count" id="historyCount">0 items</span>
            </div>
            <div id="historyList">
                <div class="empty-history">No keys generated yet</div>
            </div>
            <button class="btn btn-danger" onclick="clearHistory()" style="margin-top: 12px; width: 100%; justify-content: center;">
                🗑️ Clear History
            </button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
